# Локальный запуск на Ollama (OpenAI-совместимый endpoint), например `ollama pull qwen3:4b`.
# «Размышления» Qwen3 выключаются через reasoning_effort=none (Ollama); vLLM вместо этого использует chat_template_kwargs.
llm:
  provider: openai_compatible
  base_url: http://localhost:11434/v1
  api_key: ''
  model: qwen3:4b
  vlm_model: ''
  max_concurrency: 4
  timeout_s: 300
  temperature: 0.3
  max_retries: 2
  extra_body:
    reasoning_effort: none
image:
  provider: ${DECKSMITH_IMAGE_PROVIDER:-none}
  base_url: ${DECKSMITH_IMAGE_BASE_URL:-}
  api_key: ${DECKSMITH_IMAGE_API_KEY:-}
  model: ${DECKSMITH_IMAGE_MODEL:-black-forest-labs/FLUX.1-schnell}
  size: 1024x768
  steps: 4
  max_images_per_deck: 4
render:
  soffice: ${DECKSMITH_SOFFICE:-}
  dpi: 96
  timeout_s: 180
pipeline:
  target_slides: 12
  min_slides: 10
  max_slides: 15
  variants:
  - balanced
  - visual
  - dense
  deadline_s: 285
  visual_audit: true
  auto_fix: true
paths:
  workspace: workspace
  skills: skills
  assets: assets
