# Хостинговый OpenAI-совместимый агрегатор в стиле OpenRouter (VseGPT, OpenRouter, ...).
# Endpoint, ключ и имена моделей берутся из .env; от default.yaml отличаются только детали запросов:
# «размышления» Qwen3 выключаются параметром `reasoning` в стиле OpenRouter (переключатель vLLM
# `chat_template_kwargs` эти хосты игнорируют), а параллелизм умеренный, потому что общие
# провайдеры ограничивают всплески запросов (HTTP 429 повторяется с паузой).
#   .env: DECKSMITH_CONFIG=config/vsegpt.yaml
llm:
  provider: ${DECKSMITH_LLM_PROVIDER:-openai_compatible}
  base_url: ${DECKSMITH_LLM_BASE_URL:-https://api.vsegpt.ru/v1}
  api_key: ${DECKSMITH_LLM_API_KEY:-}
  model: ${DECKSMITH_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
  vlm_model: ${DECKSMITH_VLM_MODEL:-}
  max_concurrency: 8
  max_rps: 0.7            # VseGPT: «не больше 1 запроса в 1,0 секунды» на ключ (с запасом)
  timeout_s: 120
  temperature: 0.3
  max_retries: 3
  extra_body:
    reasoning: {enabled: false}

image:
  provider: ${DECKSMITH_IMAGE_PROVIDER:-none}   # none | openai_images | placeholder
  base_url: ${DECKSMITH_IMAGE_BASE_URL:-}
  api_key: ${DECKSMITH_IMAGE_API_KEY:-}
  model: ${DECKSMITH_IMAGE_MODEL:-img-flux/flux-2-klein-4b}   # FLUX.2 [klein] 4B, Apache 2.0
  size: 1024x768
  steps: 4
  max_images_per_deck: 4

render:
  soffice: ${DECKSMITH_SOFFICE:-}
  dpi: 96
  timeout_s: 180

pipeline:
  target_slides: 12
  min_slides: 10
  max_slides: 15
  variants: [balanced, visual, dense]
  deadline_s: 285
  visual_audit: true
  auto_fix: true

paths:
  workspace: ${DECKSMITH_WORKSPACE:-workspace}
  skills: skills
  assets: assets
