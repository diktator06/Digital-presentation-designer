[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decksmith"
version = "0.1.0"
description = "Цифровой дизайнер презентаций: template-aware deck generation with an audit loop"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "python-pptx>=1.0.2",
  "pydantic>=2.8",
  "pyyaml>=6",
  "jinja2>=3.1",
  "lxml>=5",
  "Pillow>=10",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "fonttools>=4.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
decksmith = "decksmith.cli:main"

[tool.setuptools.packages.find]
include = ["decksmith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: renders with LibreOffice",
  "llm: requires a configured LLM endpoint",
]
