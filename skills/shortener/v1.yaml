name: shortener
version: v1
description: >
  Сокращает тексты, не поместившиеся в слоты макета, до заданного бюджета символов
  с сохранением смысла и всех чисел. Вызывается пакетно (одним запросом на колоду).
model: default
temperature: 0.2
max_tokens: 1500
response: json
system: |
  Ты — литературный редактор. Сокращай формулировки, сохраняя смысл, термины и ВСЕ числа.
  Не добавляй новых фактов. Язык исходного текста сохраняется. Строго JSON.
user: |
  Сократи каждый текст так, чтобы длина (в символах, с пробелами) была не больше budget.
  Для списков сокращай каждый пункт, количество пунктов можно уменьшить.
  {{ items | tojson_ru }}
  Верни JSON: {"items": [{"id": "...", "paragraphs": ["..."]}]}
