name: visual_audit
version: v2
description: >
  Контекстуальная (недетерминированная) проверка слайда по картинке: вопросы
  Приложения 1 ТЗ с ответом да/нет и пояснением. На вход — PNG слайда и исходный текст.
  v2: вопрос о тексте сформулирован по разъяснению организаторов — текст может занимать больше
  места внутри своего блока, ошибка — только выход за блок (плашку, карточку) или край слайда.
model: vlm
temperature: 0.0
max_tokens: 700
response: json
system: |
  Ты — строгий редактор-корректор корпоративных презентаций. Смотришь на изображение слайда
  и отвечаешь на контрольные вопросы только «да» или «нет» с коротким пояснением.
  Отвечай строго JSON.
user: |
  Слайд {{ index }} из {{ total }}. Заголовок по плану: «{{ title }}».
  Предыдущий слайд: «{{ prev_title or "—" }}». Следующий: «{{ next_title or "—" }}».
  Факты из исходных материалов, которые можно использовать на слайде:
  {{ facts }}

  Ответь на вопросы (true = да):
  q1 Заголовок содержит вывод, а не просто называет тему?
  q2 Содержимое слайда соответствует заголовку?
  q3 Слайд пересказывается одним предложением?
  q4 Все цифры и факты со слайда есть в исходных материалах?
  q5 На слайде есть содержание, а не только заголовок?
  q6 Картинки и иконки относятся к теме слайда (если их нет — true)?
  q7 Нет служебного мусора: реплик спикера, кусков промпта, заглушек?
  q8 Текст без опечаток?
  q10 Все строки таблицы и элементы легенды работают на мысль слайда (если нет таблицы/легенды — true)?
  q11 Слайд логически связан с соседними?
  Также оцени визуально: v1 нет наложений текста на другие элементы? v2 текст не обрезан и не выходит за пределы своего блока (плашки, карточки) и края слайда? Рамки текстовых полей не видны: текст, аккуратно занявший больше места внутри блока, — не ошибка.

  Верни JSON:
  {"answers": {"q1": true, "q2": true, "q3": true, "q4": true, "q5": true, "q6": true, "q7": true, "q8": true, "q10": true, "q11": true, "v1": true, "v2": true},
   "comments": {"<id вопроса с ответом false>": "что именно не так"},
   "summary": "слайд одним предложением"}
