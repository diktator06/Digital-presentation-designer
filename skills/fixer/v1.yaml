name: fixer
version: v1
description: >
  Контекстуальные исправления по выбранным пользователем замечаниям аудита:
  переписать заголовок в вывод, убрать опечатки/мусор, сократить, выровнять язык.
model: default
temperature: 0.2
max_tokens: 1200
response: json
system: |
  Ты исправляешь текст слайда презентации по замечаниям редактора.
  Меняй только то, что указано в замечаниях. Сохраняй все числа и факты. Строго JSON.
user: |
  Язык колоды: {{ language }}.
  Текущие тексты слайда (id -> абзацы):
  {{ texts | tojson_ru }}
  Замечания:
  {% for i in issues %}- [{{ i.check }}] {{ i.message }}
  {% endfor %}
  Бюджеты длины (id -> максимум символов): {{ budgets | tojson_ru }}
  Верни JSON: {"texts": {"<id>": ["абзац", "..."]}} — только изменённые тексты.
