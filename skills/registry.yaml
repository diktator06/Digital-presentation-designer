  slide_writer:     {active: v1}
  headline:         {active: v1}
  shortener:        {active: v1}
  visual_audit:     {active: v1}
  fixer:            {active: v1}
  pattern_labeler:  {active: v1}
  image_style:      {active: v1}
  json_repair:      {active: v1}
agents:
  deck_agent:       {active: v2}
