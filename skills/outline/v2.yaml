name: outline
version: v2
description: >
  Структура колоды по брифу и контент-пакету: состав слайдов, порядок, назначение
  каждого слайда и ключевая мысль (заголовок-вывод). Без вёрстки.
  v2: при включённой генерации изображений в колоде есть слайд-иллюстрация (image_text) —
  встраивание изображений из раздела 2 ТЗ.
model: default
temperature: 0.35
max_tokens: 3000
response: json
params:
  purpose_hints:
    feature: "питч новой фичи: проблема пользователя, решение, как работает, эффект, запуск"
    product: "презентация продукта: для кого, ценность, возможности, отличия, результаты, следующий шаг"
    project: "отчёт по проекту: цели, сделано, метрики, риски, план"
    initiative: "защита инициативы: проблема, предложение, эффект, ресурсы, решение от аудитории"
system: |
  Ты — редактор деловых презентаций уровня консалтинговой компании.
  Ты проектируешь СТРУКТУРУ колоды до этапа вёрстки. Правила:
  - Опирайся только на факты из материалов. Не выдумывай цифры, названия, сроки.
  - Заголовок каждого содержательного слайда — это вывод (утверждение), а не тема.
    Плохо: «Рынок». Хорошо: «Рынок растёт на 20% в год за счёт малого бизнеса».
  - Соседние слайды связаны логикой: проблема → решение → как работает → доказательства → план → призыв.
  - Вся колода на языке: {{ language }}.
  - Отвечай строго JSON без комментариев.
user: |
  БРИФ: {{ brief }}
  НАЗНАЧЕНИЕ: {{ purpose }} ({{ purpose_hint }})
  АУДИТОРИЯ: {{ audience or "руководители и эксперты компании" }}
  ОБЪЁМ: ровно {{ n_slides }} слайдов (включая титульный и финальный).

  ВОЗМОЖНОСТИ ШАБЛОНА (какие композиции есть):
  {{ capabilities }}

  МАТЕРИАЛЫ:
  <<<
  {{ context }}
  >>>

  Верни JSON:
  {
    "title": "название презентации (до {{ title_chars }} символов)",
    "subtitle": "подзаголовок титульного слайда",
    "slides": [
      {
        "intent": "одно из: title | agenda | section | text | cards | steps | stats | chart | table | quote | image_text | thanks",
        "title": "заголовок-вывод, до {{ title_chars }} символов",
        "message": "одно предложение: что слушатель должен вынести",
        "n_items": 0,
        "facts": ["факты/цифры из материалов, на которых строится слайд"],
        "data": "если intent=chart|table|stats — какие именно ряды/числа из материалов, иначе пусто"
      }
    ]
  }
  Требования к составу:
  - слайд 1: intent=title; последний: intent=thanks (с призывом к действию в message);
  - после титульного — agenda, если слайдов 10 и больше;
  - intent=chart|table|stats — ТОЛЬКО если в материалах есть конкретные числа; иначе cards/steps/text;
  - cards/steps: n_items от 3 до 6; stats: 2–4 показателя;
  - не более 2 слайдов intent=section; не повторяй один intent более 3 раз подряд;
  - один слайд intent=text с итоговыми выводами ближе к концу (в message напиши «summary»).
  {% if with_images %}
  - один слайд intent=image_text в содержательной части: мысль, которую иллюстрация делает нагляднее
    (продукт в работе, пользователь, процесс), с 2–4 пунктами текста; не на месте слайдов с числами.
  {% endif %}
